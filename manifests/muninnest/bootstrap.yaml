apiVersion: v1
kind: ServiceAccount
metadata:
  name: memos-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: memos-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [muninnest-secrets]
    verbs: [get, update]
  # Kubernetes cannot restrict create by resourceNames. This permission is
  # confined to this application's namespace; no list or delete access.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [muninnest]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: memos-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: memos-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: memos-bootstrap
---
apiVersion: batch/v1
kind: Job
metadata:
  name: memos-bootstrap
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    spec:
      serviceAccountName: memos-bootstrap
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: python:3.14-slim-bookworm
          command: [python, -B, /bootstrap/bootstrap.py]
          envFrom:
            - secretRef:
                name: muninnest-bootstrap
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /bootstrap
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: memos-bootstrap-script
