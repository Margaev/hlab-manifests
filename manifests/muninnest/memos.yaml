apiVersion: apps/v1
kind: Deployment
metadata:
  name: memos
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: memos
  template:
    metadata:
      labels:
        app: memos
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: memos
          image: neosmemo/memos:0.31.0
          ports:
            - name: http
              containerPort: 5230
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/opt/memos
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: memos-data
---
apiVersion: v1
kind: Service
metadata:
  name: memos
spec:
  type: ClusterIP
  selector:
    app: memos
  ports:
    - name: http
      port: 5230
      targetPort: http
