apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: muninnest
resources:
  - bot.yaml
  - memos.yaml
  - storage.yaml
  - ingress.yaml
  - certificate.yaml
  - bootstrap.yaml
generators:
  - secrets-generator.yaml
configMapGenerator:
  - name: memos-bootstrap-script
    files:
      - bootstrap.py
    options:
      disableNameSuffixHash: true
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
