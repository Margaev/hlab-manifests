apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: muninnest-models
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 4Gi
